
spring:
  application:
    name: MedMaisFacil

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/DBMMF}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

medmaisfacil:
  lotacao:
    janela-hora: 3

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 15
